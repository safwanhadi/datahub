{% load static %}
<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Masuk — SIMRS DataHub</title><link rel="stylesheet" href="{% static 'css/app.css' %}"></head>
<body class="login-page"><section class="login-card">
  <div class="brand center"><span class="brand-mark">D</span><div>DataHub<small>SIMRS Verification</small></div></div>
  <h1>Selamat datang kembali</h1><p>Masuk untuk mengelola dan memverifikasi data rumah sakit.</p>
  {% if form.errors %}<div class="alert error">Nama pengguna atau kata sandi tidak tepat.</div>{% endif %}
  <form method="post" class="stack">{% csrf_token %}
    <label>Nama pengguna {{ form.username }}</label>
    <label>Kata sandi {{ form.password }}</label>
    <button class="primary full">Masuk ke dashboard</button>
  </form>
</section></body></html>
