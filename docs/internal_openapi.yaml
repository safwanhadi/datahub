openapi: 3.0.3
info:
  title: SIMRS DataHub API
  version: 1.0.0
  description: API data rumah sakit yang telah melalui proses verifikasi.
paths:
  /api/internal/v1/health-indicators/:
    get:
      operationId: health_indicators_retrieve
      parameters:
      - in: query
        name: bulan
        schema:
          type: integer
        description: Bulan laporan 1–12
      - in: query
        name: tahun
        schema:
          type: integer
        description: Tahun laporan, contoh 2026
      tags:
      - Internal - Indikator Kesehatan
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalMonthlyHealthEnvelope'
          description: ''
  /api/internal/v1/indicators/inpatient/:
    get:
      operationId: indicators_inpatient_retrieve
      parameters:
      - in: query
        name: bulan
        schema:
          type: integer
        description: Bulan laporan 1–12
      - in: query
        name: tahun
        schema:
          type: integer
        description: Tahun laporan, contoh 2026
      tags:
      - Internal - Indikator
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalIndicatorEnvelope'
          description: ''
components:
  schemas:
    InternalIndicator:
      type: object
      properties:
        periode:
          type: string
          format: date
        jenis_periode:
          type: string
        tanggal_awal:
          type: string
          format: date
        tanggal_akhir:
          type: string
          format: date
        status:
          type: string
        alos:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        bor:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        bto:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        toi:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        gdr:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        ndr:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        notes:
          type: string
        verified_by:
          type: string
          nullable: true
        verified_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
      required:
      - alos
      - bor
      - bto
      - gdr
      - jenis_periode
      - ndr
      - notes
      - periode
      - status
      - tanggal_akhir
      - tanggal_awal
      - toi
      - updated_at
      - verified_at
      - verified_by
    InternalIndicatorEnvelope:
      type: object
      properties:
        count:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/InternalIndicator'
      required:
      - count
      - results
    InternalMonthlyHealth:
      type: object
      properties:
        periode:
          type: string
          format: date
        jenis_periode:
          type: string
        tanggal_awal:
          type: string
          format: date
        tanggal_akhir:
          type: string
          format: date
        status:
          type: string
        hospital_code:
          type: string
        hospital_name:
          type: string
        data: {}
        verified_by:
          type: string
          nullable: true
        verified_at:
          type: string
          format: date-time
          nullable: true
      required:
      - data
      - hospital_code
      - hospital_name
      - jenis_periode
      - periode
      - status
      - tanggal_akhir
      - tanggal_awal
      - verified_at
      - verified_by
    InternalMonthlyHealthEnvelope:
      type: object
      properties:
        count:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/InternalMonthlyHealth'
      required:
      - count
      - results
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
